<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Gardien des groupes — édition corrigée</title><meta name="description" content="Mini-jeu guidé de théorie des groupes : 11 missions corrigées, laboratoire de symétries et codex."><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:17px/1.6 system-ui,sans-serif}header,main{max-width:1000px;margin:auto;padding:18px}h1{font-size:1.6rem}h2{font-size:1.3rem}button,select{font:inherit;color:inherit;background:#1b2946;border:1px solid #607299;border-radius:9px;padding:10px;cursor:pointer}button:focus-visible{outline:3px solid #73dfff}button:disabled{opacity:.55;cursor:default}nav{display:flex;gap:8px;flex-wrap:wrap}.integrated-nav{margin:0 0 14px}.integrated-nav a{display:inline-flex;align-items:center;min-height:42px;padding:7px 11px;border:1px solid #607299;border-radius:999px;background:#17233b;color:#dbe7ff;text-decoration:none;font-size:.84rem;font-weight:700}.integrated-nav a:hover,.integrated-nav a:focus-visible{border-color:#73dfff;color:#fff;outline:2px solid #73dfff;outline-offset:2px}article,.box{background:#141d32;border:1px solid #384968;border-radius:12px;padding:16px;margin:15px 0}.definition{border-left:4px solid #73dfff;padding:14px;background:#10182b;white-space:pre-wrap}.choices{display:grid;gap:10px}.choice{text-align:left}.chosen{border:2px solid #73dfff;background:#253c5d}.ok{border-left:4px solid #66e6a0;padding:12px}.bad{border-left:4px solid #ff9696;padding:12px}.muted{color:#bfcae0;font-size:.9rem}.math{font-family:Cambria,'DejaVu Sans',serif;font-size:1.08em}.arena{display:grid;grid-template-columns:repeat(2,90px);gap:35px;width:max-content;margin:20px auto}.point{border-radius:50%;height:65px;width:65px}.target{background:#24566b;border:3px solid #73dfff}summary{cursor:pointer}progress{width:100%}@media(max-width:500px){header,main{padding:12px}button{min-height:46px}nav button{font-size:.9rem}article{padding:12px}}</style>
<header><nav class="integrated-nav" aria-label="Navigation de révision"><a href="../../index.html">← Atelier AGREG 27</a><a href="../../guides/titre-02.html">Guide du titre 2</a><a href="../../jeu.html?title=t02#daily-session">Séance quotidienne T2 →</a></nav><h1>Le Gardien des groupes</h1><p>Édition autonome : formules lisibles hors connexion, laboratoire et procès des preuves.</p><p id="status"></p><progress id="progress" max="11"></progress><nav id="nav" aria-label="Missions du jeu"></nav></header><main id="main"></main>
<script>
const missions=[["Reconnaître un groupe", "Un groupe est un ensemble non vide muni d’une loi interne associative, avec un neutre e et un inverse pour chaque élément.", [["Quels sont les groupes ?", ["(ℤ/6ℤ, +)", "(ℚ*, ×)", "(ℕ, +)", "(M₂(ℝ), +)"], [0, 1, 3], "Les rationnels non nuls sont inversibles pour × ; les matrices ont toutes un opposé pour +. Dans ℕ, 1 n’a pas d’opposé."], ["Dans (ℤ/6ℤ, +), quel est l’inverse de 4 ?", ["2", "3", "4", "5"], [0], "4 + 2 ≡ 0 modulo 6. Un inverse dépend de la loi : ici, il s’agit d’un opposé."]]], ["Composer les symétries", "D₄ désigne ici le groupe des huit symétries du carré. Le produit gh signifie : appliquer h, puis g.", [["r est la rotation de 90° ; s la réflexion par rapport à l’axe horizontal. Quelle relation est vraie ?", ["sr = rs", "sr = r⁻¹s", "r² = e"], [1], "Une réflexion inverse le sens de rotation : sr = r⁻¹s. Ce groupe n’est pas commutatif."], ["Quel est l’ordre de r ?", ["2", "4", "8"], [1], "r⁴ = e et aucune des puissances r, r², r³ n’est l’identité."]]], ["Construire un sous-groupe", "H ≤ G signifie que H est un sous-groupe de G. Critère : H est non vide et, pour tous a,b ∈ H, ab⁻¹ ∈ H.", [["Quels sont les sous-groupes de (ℤ/6ℤ, +) parmi ces parties ?", ["{0}", "{0, 2, 4}", "{0, 3}", "{1, 2, 3}"], [0, 1, 2], "Les trois premières parties contiennent 0 et sont stables par différence. {1,2,3} ne contient pas le neutre."], ["Quel sous-groupe r engendre-t-il dans D₄ ?", ["{e, r, r², r³}", "{e, r²}", "D₄"], [0], "⟨r⟩ contient toutes les puissances de r : exactement les quatre rotations."]]], ["Classes et indice", "Pour H ≤ G, la classe à gauche gH est {gh : h ∈ H}. Les classes partitionnent G. Leur nombre est l’indice [G:H].", [["Dans ℤ/6ℤ, H = {0,3}. Quelles sont les classes distinctes ?", ["{0,3}, {1,4}, {2,5}", "{0,1}, {2,3}, {4,5}", "{0,2,4}, {1,3,5}"], [0], "1 + H = {1,4}, 2 + H = {2,5}. Chaque classe a autant d’éléments que H."], ["Quel est [ℤ/6ℤ : H] ?", ["2", "3", "6"], [1], "Il y a trois classes : 6 = 3 × 2. C’est la relation de Lagrange dans le cas fini."]]], ["Normalité et quotient", "H ◁ G signifie : pour tout g ∈ G, gHg⁻¹ = H. Cette condition rend le produit (gH)(kH) = (gk)H indépendant des représentants.", [["Pourquoi H = {0,3} est-il distingué dans ℤ/6ℤ ?", ["Tout sous-groupe d’un groupe abélien est distingué", "Tout sous-groupe fini est distingué"], [0], "Dans un groupe abélien, ghg⁻¹ = h. La finitude seule ne suffit pas."], ["À quel groupe (ℤ/6ℤ)/{0,3} est-il isomorphe ?", ["ℤ/2ℤ", "ℤ/3ℤ", "ℤ/6ℤ"], [1], "Le quotient a trois éléments. L’application [x]₆ ↦ [x]₃ a pour noyau {0,3}."]]], ["Morphismes", "Un morphisme φ : G → K préserve le produit : φ(ab) = φ(a)φ(b). ker φ = {g : φ(g) = e_K} ; Im φ = {φ(g) : g ∈ G}.", [["Un morphisme est injectif exactement lorsque…", ["ker φ = {e_G}", "Im φ = {e_K}", "ker φ = G"], [0], "φ(a) = φ(b) équivaut à φ(b⁻¹a) = e_K. Un noyau trivial impose a = b."], ["Quel est le premier théorème d’isomorphisme ?", ["G/ker φ ≅ Im φ", "G/Im φ ≅ ker φ", "G ≅ K toujours"], [0], "On identifie deux éléments du départ précisément lorsqu’ils ont la même image. Le noyau est distingué dans G."]]], ["Actions : le laboratoire", "Une action G × X → X vérifie e·x = x et (gh)·x = g·(h·x). Une transformation est un élément de G ; une position est un élément de X.", [["Que contient l’orbite G·x ?", ["Des points de X", "Des transformations de G"], [0], "G·x = {g·x : g ∈ G}. Une orbite rassemble les destinations possibles."], ["Que contient le stabilisateur Gₓ ?", ["Des points de X", "Des transformations de G"], [1], "Gₓ = {g ∈ G : g·x = x}. Il est un sous-groupe de G."]]], ["Orbite et stabilisateur", "G·x = {g·x : g ∈ G} ; Gₓ = {g ∈ G : g·x = x}. La bijection G/Gₓ → G·x envoie gGₓ sur g·x. Ici G/Gₓ désigne l’ensemble des classes, pas nécessairement un groupe quotient.", [["D₄ agit sur les sommets du carré. Pour un sommet x :", ["|G·x| = 4 et |Gₓ| = 2", "|G·x| = 2 et |Gₓ| = 4"], [0], "Les quatre sommets sont atteignables. L’identité et la réflexion diagonale passant par x fixent x."], ["Pour le centre du carré, dans l’action sur le plan :", ["Orbite de taille 1, stabilisateur de taille 8", "Orbite de taille 8, stabilisateur de taille 1"], [0], "Toutes les symétries fixent le centre. Dans les deux cas : |G| = |G·x| × |Gₓ|."]]], ["Conjugaison", "G agit sur lui-même par g·a = gag⁻¹. L’orbite de a est sa classe de conjugaison ; son stabilisateur est le centralisateur C_G(a) = {g : ga = ag}.", [["Que signifie a ∈ Z(G) ?", ["a commute avec tous les éléments de G", "a est conjugué au neutre"], [0], "Z(G) = {a : pour tout g, ag = ga}. Sa classe de conjugaison est alors {a}."], ["Quel est le centre de D₄ ?", ["{e, r²}", "{e}", "D₄"], [0], "La rotation de 180° commute avec toutes les symétries ; les rotations de 90° et les réflexions ne le font pas."]]], ["Sylow", "Si |G| = pᵅm, où p est premier et p ne divise pas m, un p-Sylow est un sous-groupe d’ordre pᵅ. Ils existent, sont conjugués, et leur nombre nₚ divise m et est congru à 1 modulo p.", [["Dans un groupe d’ordre 12, quel est l’ordre d’un 2-Sylow ?", ["2", "4", "6"], [1], "12 = 2² × 3 : la plus grande puissance de 2 qui divise 12 est 4."], ["Quelles possibilités Sylow donne-t-il pour n₃ si |G| = 12 ?", ["1 ou 4", "1 ou 3", "2 ou 4"], [0], "n₃ divise 4 et n₃ ≡ 1 modulo 3."], ["Un unique p-Sylow est…", ["distingué", "nécessairement central", "nécessairement trivial"], [0], "La conjugaison permute les p-Sylow. S’il n’y en a qu’un, il est préservé par chaque conjugaison."]]], ["Erreur type : le procès des preuves", "Pour chaque fausse preuve, repère l’étape illégitime puis répare l’argument. Un diagnostic seul ne suffit pas.", [["Preuve : « H ≤ G. Pour h ∈ H et g ∈ G, ghg⁻¹ ∈ H par stabilité de H. Donc H ◁ G. » Où est l’erreur ?", ["La stabilité ne concerne que des produits d’éléments de H ; g peut être hors de H", "Un sous-groupe ne contient pas les inverses", "Il faut seulement que G soit fini"], [0], "On sait multiplier des éléments de H entre eux, pas conjuguer par un élément arbitraire de G."], ["Quelle réparation est valable ?", ["Ajouter l’hypothèse G abélien : ghg⁻¹ = h ∈ H", "Ajouter seulement H fini", "Ajouter seulement H non vide"], [0], "L’hypothèse abélienne fournit réellement la normalité ; la finitude et la non-vacuité ne le font pas."], ["Preuve : « G·x est stable par produit, donc c’est un sous-groupe. » Première objection ?", ["Les éléments de G·x sont des points de X ; aucun produit sur X n’est donné", "Une orbite est toujours vide", "Une action exige X = G"], [0], "Avant de chercher une stabilité, il faut identifier le type des objets. Une orbite est une partie de X, pas en général de G."], ["Quelle affirmation remplace correctement la précédente ?", ["Gₓ est un sous-groupe de G", "G·x est toujours distingué dans G", "X est toujours un groupe"], [0], "e fixe x ; si g et h fixent x, gh⁻¹ fixe aussi x. Le critère de sous-groupe s’applique à Gₓ."], ["Preuve : « |G| = 12. Comme 6 divise 12, G possède un sous-groupe d’ordre 6. » Erreur ?", ["La réciproque de Lagrange n’est pas vraie en général", "Lagrange ne s’applique qu’aux groupes abéliens", "6 ne divise pas 12"], [0], "Lagrange donne une condition nécessaire, non suffisante. Le groupe alterné A₄ a ordre 12 et aucun sous-groupe d’ordre 6."], ["Quelle conclusion d’existence est garantie ici par Sylow ?", ["Un sous-groupe d’ordre 4 et un d’ordre 3", "Un sous-groupe d’ordre 6", "Un sous-groupe de chaque ordre divisant 12"], [0], "4 et 3 sont les puissances maximales de 2 et de 3 divisant 12. Sylow garantit ces deux ordres, pas tous les diviseurs."]]]];
const storage='gardien-edition-corrigee-v3';let saved={done:[],current:0};try{saved=JSON.parse(localStorage.getItem(storage))||saved}catch(e){}let current=saved.current||0;let selections={},solved={},attempts={},lab={start:0,op:0,seen:[],hits:[]};
const main=document.getElementById('main');function persist(){saved.current=current;try{localStorage.setItem(storage,JSON.stringify(saved))}catch(e){}}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function button(text,fn,parent,cls){const b=el('button',text,cls);b.onclick=fn;parent.append(b);return b}
function render(){persist();document.getElementById('status').textContent=`${saved.done.length} / 11 sceaux obtenus · ${saved.done.length*100} XP · Les erreurs n’enlèvent aucun point.`;document.getElementById('progress').value=saved.done.length;const nav=document.getElementById('nav');nav.replaceChildren();missions.forEach((m,i)=>button(`${saved.done.includes(i)?'✓ ':''}${i+1}`,()=>{current=i;render()},nav));button('Codex',codex,nav);main.replaceChildren();const m=missions[current];main.append(el('h2',`Mission ${current+1} — ${m[0]}`));main.append(el('p',m[1],'definition math'));if(current===6)renderLab();m[2].forEach((q,j)=>renderQuestion(q,j));const footer=el('article');button('Réclamer le sceau de cette mission',()=>{const all=m[2].every((_,j)=>solved[current+'-'+j]);const explored=current!==6||lab.seen.length===8;message.textContent=!all?'Résous chaque épreuve ; les réparations font partie du défi.':!explored?'Explore aussi les huit transformations dans le laboratoire.':'Sceau obtenu. Tu peux poursuivre ou refaire les épreuves sans les corrections.';if(all&&explored&&!saved.done.includes(current)){saved.done.push(current);persist();document.getElementById('status').textContent=`${saved.done.length} / 11 sceaux · ${saved.done.length*100} XP`;document.getElementById('progress').value=saved.done.length}},footer);const message=el('p');message.setAttribute('role','status');footer.append(message);if(current<10)button('Mission suivante',()=>{current++;render()},footer);main.append(footer);main.append(el('p','Les sceaux sont sauvegardés localement. Les réponses en cours repartent à zéro si tu fermes la page. Cette campagne constitue un socle, pas toute la théorie des groupes de l’agrégation.','muted'))}
function renderQuestion(q,j){const k=current+'-'+j;const card=el('article');card.append(el('h3',`Épreuve ${j+1}`));card.append(el('p',q[0],'math'));card.append(el('p',q[2].length>1?'Plusieurs réponses attendues.':'Une seule réponse attendue.','muted'));const choices=el('div',undefined,'choices');selections[k]=selections[k]||[];q[1].forEach((text,i)=>{const b=button(text,()=>{if(solved[k])return;if(selections[k].includes(i))selections[k]=selections[k].filter(x=>x!==i);else selections[k]=q[2].length===1?[i]:[...selections[k],i];[...choices.children].forEach((n,z)=>{n.classList.toggle('chosen',selections[k].includes(z));n.setAttribute('aria-pressed',selections[k].includes(z))})},choices,'choice math');b.classList.toggle('chosen',selections[k].includes(i));b.setAttribute('aria-pressed',selections[k].includes(i))});card.append(choices);const feedback=el('div');feedback.setAttribute('role','status');button('Soumettre mon raisonnement',()=>{if(solved[k])return;const s=selections[k];if(!s.length){feedback.textContent='Choisis au moins une réponse.';return}const correct=s.length===q[2].length&&q[2].every(i=>s.includes(i));attempts[k]=(attempts[k]||0)+1;if(correct){solved[k]=true;feedback.className='ok';feedback.textContent='Validé. '+q[3]}else{feedback.className='bad';feedback.textContent=attempts[k]===1?'Pas encore. Repars de la définition et vérifie le type de chaque objet. Tu peux modifier tes choix.':'Indice explicatif : '+q[3]+' Modifie ta réponse et soumets-la de nouveau.'}},card);card.append(feedback);if(solved[k]){feedback.className='ok';feedback.textContent='Validé. '+q[3]}main.append(card)}
const pts=[[1,1],[-1,1],[-1,-1],[1,-1]],names=['A','B','C','D'];const ops=[['e',([x,y])=>[x,y]],['r',([x,y])=>[-y,x]],['r²',([x,y])=>[-x,-y]],['r³',([x,y])=>[y,-x]],['s horizontal',([x,y])=>[x,-y]],['s vertical',([x,y])=>[-x,y]],['s diagonale y = x',([x,y])=>[y,x]],['s diagonale y = −x',([x,y])=>[-y,-x]]];
function renderLab(){const box=el('article');box.append(el('h3','Laboratoire : deviner la destination'));box.append(el('p','Coordonnées : A = (1,1), B = (−1,1), C = (−1,−1), D = (1,−1). À chaque essai, on agit sur le point de départ choisi, pas sur la destination précédente.'));const select=el('select');select.setAttribute('aria-label','Point de départ');names.forEach((n,i)=>{const o=el('option','Départ '+n);o.value=i;select.append(o)});select.value=lab.start;select.onchange=()=>{lab={start:Number(select.value),op:0,seen:[],hits:[]};render()};box.append(select);const opSelect=el('select');opSelect.setAttribute('aria-label','Transformation');ops.forEach((o,i)=>{const n=el('option',o[0]);n.value=i;opSelect.append(n)});opSelect.value=lab.op;box.append(opSelect);const prompt=el('p');function ask(){lab.op=Number(opSelect.value);prompt.textContent=`Où ${ops[lab.op][0]} envoie-t-il ${names[lab.start]} ? Clique la destination avant de voir la réponse.`}opSelect.onchange=ask;ask();box.append(prompt);const arena=el('div',undefined,'arena');const feed=el('p');feed.setAttribute('role','status');[1,0,2,3].forEach(i=>button(names[i],()=>{const p=ops[lab.op][1](pts[lab.start]);const dest=pts.findIndex(v=>v[0]===p[0]&&v[1]===p[1]);if(i!==dest){feed.textContent='Pas cette destination. Utilise les coordonnées : '+ops[lab.op][0]+' agit sur '+JSON.stringify(pts[lab.start])+'.';return}if(!lab.seen.includes(lab.op))lab.seen.push(lab.op);if(!lab.hits.includes(dest))lab.hits.push(dest);const fixed=lab.seen.filter(o=>{const p=ops[o][1](pts[lab.start]);return p[0]===pts[lab.start][0]&&p[1]===pts[lab.start][1]});feed.textContent=`Correct : ${names[dest]}. Transformations explorées : ${lab.seen.length}/8. Destinations : {${lab.hits.map(i=>names[i]).join(', ')}}. Transformations testées fixant le départ : {${fixed.map(o=>ops[o][0]).join(', ')}}.`},arena,'point'+(i===lab.start?' target':'')));box.append(arena,feed);box.append(el('p',`Exploration : ${lab.seen.length}/8. Les essais répétés ne comptent qu’une fois.`,'muted'));main.append(box)}
function codex(){main.replaceChildren();main.append(el('h2','Codex et carte des liens'));main.append(el('p','Groupe → sous-groupe → classes → normalité → quotient. Morphisme → noyau distingué → quotient isomorphe à l’image. Action → orbite et stabilisateur → classes et comptage. Conjugaison → centralisateur → centre et Sylow.'));missions.forEach((m,i)=>{const d=el('details',undefined,'box');d.append(el('summary',`${saved.done.includes(i)?'Sceau obtenu':'À travailler'} — ${m[0]}`));d.append(el('p',m[1],'math'));main.append(d)});button('Reprendre la mission',render,main);button('Effacer la progression',()=>{if(confirm('Effacer les sceaux et les réponses ?')){saved={done:[],current:0};current=0;selections={};solved={};attempts={};render()}},main)}
render();
</script></html>
